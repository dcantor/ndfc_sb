---
# Stage 01 — discover/add all four N9K cores into the External fabric as core_router.
# Devices are added by mgmt IP; NDFC manages them by serial thereafter.
- name: Add core routers to the fabric
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../vault/secrets.yml
    - ../vars/topology.yml
  tasks:
    - name: Add the four core routers (role core_router)
      cisco.dcnm.dcnm_inventory:
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - seed_ip: "{{ devices[item].mgmt_ip }}"
            auth_proto: MD5
            user_name: "{{ device_username }}"
            password: "{{ device_password }}"
            max_hops: 0
            role: core_router
            preserve_config: true     # do not wipe existing switch config on import
      loop: "{{ devices.keys() | list }}"
      loop_control:
        label: "{{ item }} ({{ devices[item].mgmt_ip }})"
      register: inv_result

    - name: Show inventory result
      ansible.builtin.debug:
        var: inv_result
