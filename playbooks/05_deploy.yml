---
# Stage 05 — confirm/redeploy.
# Stages 02 (interfaces), 03 (links) and 04 (policies) each deploy their own objects
# via the module `deploy: true` parameter, so by this point config has been pushed to
# the cores. This stage re-asserts the freeform policies with deploy enabled — an
# idempotent safety net that forces any still-pending switch config to deploy.
- name: Confirm deployment to the cores
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../vault/secrets.yml
  tasks:
    - name: Load per-core switch facts
      ansible.builtin.include_vars:
        file: "../host_vars/{{ item }}.yml"
        name: "sw_{{ item }}"
      loop: "{{ core_switches }}"

    - name: Re-deploy freeform policies (idempotent flush of pending config)
      cisco.dcnm.dcnm_policy:
        fabric: "{{ fabric_name }}"
        state: query
        config:
          - description: "ndfc_sb BGP+VRF freeform ({{ item }})"
        switch:
          - ip: "{{ (lookup('vars', 'sw_' ~ item)).switch.mgmt_ip }}"
      loop: "{{ core_switches }}"
      loop_control:
        label: "{{ item }}"
      register: deploy_confirm

    - name: Show deployed policy state
      ansible.builtin.debug:
        var: deploy_confirm
