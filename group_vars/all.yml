---
# Global defaults shared by every play. Topology (devices, ASNs, links) lives in
# vars/topology.yml; VRFs in vars/vrfs.yml; BGP/BFD knobs in vars/bgp.yml.

# Name of the External fabric that holds all four core routers.
fabric_name: "DC-CORE"

# Default routed MTU for fabric links / sub-interfaces.
default_mtu: 9216

# Nominal AS for the External fabric object itself. The real per-DC ASNs live in
# vars/topology.yml; this is only the fabric-level attribute NDFC stores.
fabric_bgp_as: 65001
