[defaults]
inventory                = inventory/hosts.yml
collections_path         = ./collections:~/.ansible/collections
host_key_checking        = False
retry_files_enabled      = False
stdout_callback          = yaml
deprecation_warnings     = True
interpreter_python       = auto_silent
# All work is driven against the NDFC controller over httpapi; the switches
# are reached by NDFC, never directly by Ansible.

[persistent_connection]
# NDFC REST calls (fabric create, recalculate/deploy) can be slow.
connect_timeout          = 120
command_timeout          = 120
