---
# The two VRF-Lite VRFs, extended end-to-end across both data centers.
# FULLY ISOLATED: each VRF has its own loopback, its own dot1q sub-interfaces,
# its own RD, and NO route-target import/export — so the two VRFs never exchange
# routes (see templates/device_freeform.j2, "VRF contexts" section).
#
#   loopback_id : loopback interface number used for this VRF's BGP peering
#                 (loopback0 is the global table). Must be unique per VRF.
#   rd_index    : RD is rendered per device as "<local-asn>:<rd_index>".
#   networks    : prefixes originated into this VRF.
#   route_maps  : inbound/outbound policy applied to eBGP (inter-DC) neighbors,
#                 scoped to this VRF only — never references the other VRF.
vrfs:
  - name: "VRF_A"
    loopback_id: 1
    rd_index: 10
    description: "Tenant A — isolated"
    networks:
      - "10.10.0.0/16"
    route_maps:
      inbound: "RM_VRF_A_IN"
      outbound: "RM_VRF_A_OUT"

  - name: "VRF_B"
    loopback_id: 2
    rd_index: 20
    description: "Tenant B — isolated"
    networks:
      - "10.20.0.0/16"
    route_maps:
      inbound: "RM_VRF_B_IN"
      outbound: "RM_VRF_B_OUT"
