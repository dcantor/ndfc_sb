---
# Global BGP / BFD knobs. AS numbers are per-DC (see vars/topology.yml:datacenters);
# per-device router-ids and neighbors are derived from the topology.

# BFD timers applied to every transit link / sub-interface and enabled on every
# BGP neighbor ("BFD for BGP for all links"). Tune for your platform/SLA.
bfd:
  interval: 300       # tx interval (ms)
  min_rx: 300         # min rx interval (ms)
  multiplier: 3       # detect-multiplier

# eBGP loopback peering across the DCI is multihop (loopback-to-loopback over a
# directly-connected link). TTL of 2 is sufficient for the square topology.
ebgp_multihop_ttl: 2

# OSPF is the intra-DC IGP that makes iBGP loopbacks reachable (global table +
# one context per VRF), replacing the intra-DC static routes. It runs ONLY on
# intra-DC links; inter-DC reachability stays on static routes (eBGP multihop).
# BFD is enabled for OSPF on those links (ip ospf bfd).
ospf:
  process: "UNDERLAY"
  area: "0.0.0.0"
