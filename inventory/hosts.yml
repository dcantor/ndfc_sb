---
# The ONLY Ansible inventory host is the NDFC controller. All cisco.dcnm modules
# run against it over httpapi and fan out to the switches by mgmt IP / serial.
all:
  children:
    ndfc:
      hosts:
        ndfc1:
          # NDFC / Nexus Dashboard controller VIP (override here or in group_vars/ndfc.yml)
          ansible_host: 10.0.0.10
