---
# Core router #1. These are switch FACTS (the switch is not an SSH inventory host —
# this file is loaded explicitly with include_vars by the playbooks, keyed by name).
switch:
  name: "core1"
  mgmt_ip: "10.0.1.11"
  serial_number: "FDO00000001"     # NDFC discovers/manages by serial
  role: "core_router"

  # Loopback0 = router-id and iBGP source in the global table.
  loopback0:
    ip: "10.255.255.1"
    mask: 32

  # Point-to-point link to the other core in the GLOBAL/default VRF (carries the
  # global iBGP session + loopback reachability).
  core_p2p:
    intf: "Ethernet1/1"
    ipv4: "10.0.255.1"
    mask: 31
    peer: "core2"
