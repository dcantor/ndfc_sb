---
# Install with:  ansible-galaxy collection install -r requirements.yml
#
# Pin the cisco.dcnm major version: fabric_type casing ("External") and link
# template names ("ext_fabric_setup") are version-sensitive. Verify against the
# NDFC release you target before the first run.
#
# Version floor 3.9.0 = the release that added httpapi support for Nexus Dashboard
# 4.1 (validated target: ND 4.1.1g via legacy APIs). It still supports NDFC 12.2.x,
# so this floor is safe for both 12.x and ND 4.x. Prefer the newest 3.x available.
collections:
  - name: cisco.dcnm
    version: ">=3.9.0,<4.0.0"
  - name: ansible.netcommon
    version: ">=5.0.0"
